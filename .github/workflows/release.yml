name: Release

# Publishing a GitHub release tagged with the version (e.g. v1.0.0) attaches an installable module.json and
# module.zip to it. The manifest URL in module.json always points at the latest release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/${REPO}/releases/latest/download/module.json" \
             --arg download "https://github.com/${REPO}/releases/download/${TAG}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json README.md lang scripts styles templates

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json module.zip --clobber
