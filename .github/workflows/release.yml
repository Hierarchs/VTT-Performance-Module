name: Release

# Pushing a version tag (e.g. v1.0.0) creates a GitHub release with an installable module.json and module.zip
# attached. Publishing a release from the GitHub UI attaches the same files to it. The manifest URL in
# module.json always points at the latest release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

# A release created in the UI can fire both events for the same tag; handle them one at a time
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/${REPO}/releases/latest/download/module.json" \
             --arg download "https://github.com/${REPO}/releases/download/${TAG}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module.zip
        run: zip -r module.zip module.json README.md lang scripts styles templates

      - name: Create the release, or attach to the existing one
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" module.json module.zip --repo "$REPO" --clobber
          else
            gh release create "$TAG" module.json module.zip --repo "$REPO" --title "$TAG" --generate-notes --verify-tag
          fi
